<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Daily fundamental currency research. Eight currencies, transparent scores, and reports timed for Austria.">
  <title>Forex Brief — FX fundamentals</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0d10'/%3E%3Cpath d='M6 22l6-7 5 4 9-10' fill='none' stroke='%2326a69a' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to report</a>

  <header class="topbar">
    <a class="brand" href="./" aria-label="Forex Brief home"><span class="brand-mark" aria-hidden="true">FX</span><span class="brand-name">BRIEF</span></a>
    <div class="topbar-meta">
      <span id="freshness" class="badge muted">Loading</span>
      <span class="clock"><span id="vienna-clock">--:--</span> <span class="muted">Vienna</span></span>
    </div>
  </header>

  <nav class="tabs" aria-label="Report navigation">
    <button class="tab active" data-view="overview" aria-current="page">Overview</button>
    <button class="tab" data-view="evidence">Evidence</button>
    <button class="tab" data-view="calendar">Calendar</button>
    <button class="tab" data-view="history">History</button>
    <button class="tab" data-view="method">Method</button>
  </nav>

  <main id="main">
    <div class="toolbar">
      <div class="edition" id="report-edition">Daily fundamentals</div>
      <div class="controls">
        <label class="sr-only" for="report-select">Choose report</label>
        <select id="report-select"><option value="latest">Latest report</option><option value="demo">Illustrative preview</option></select>
        <button id="refresh" class="icon-button" aria-label="Refresh published report">↻</button>
      </div>
    </div>

    <div id="status-banner" class="notice" role="status">Illustrative preview. Live reporting is not connected. All example scores are synthetic.</div>

    <div id="content" aria-live="polite"></div>

    <footer>
      <span>Fundamentals inform the bias. Execution stays with you.</span>
      <span><span id="schedule-note">Schedule: see Method</span> · <span id="model-version">Model 1.0</span></span>
    </footer>
  </main>

  <dialog id="detail" aria-labelledby="detail-title">
    <button id="close-detail" class="icon-button close" aria-label="Close currency details">×</button>
    <div id="detail-content"></div>
  </dialog>
</body>
</html>
